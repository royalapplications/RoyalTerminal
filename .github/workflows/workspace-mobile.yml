name: Workspace mobile clients
on:
  workflow_dispatch:
  pull_request:
    paths: ['samples/RoyalTerminal.Multiplexing.Mobile*/**','tests/RoyalTerminal.Multiplexing.MobileTests/**','samples/RoyalTerminal.Multiplexing.Desktop/**','src/**','scripts/workspace/mobile-*.sh','.github/workflows/workspace-mobile.yml','Directory.*','global.json']
permissions: {contents: read}
concurrency: {group: 'workspace-mobile-${{ github.ref }}', cancel-in-progress: true}
jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - run: dotnet test tests/RoyalTerminal.Multiplexing.MobileTests -c Release
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - name: Build debug APK with the Android workload
        run: |
          dotnet workload install android
          dotnet build samples/RoyalTerminal.Multiplexing.Mobile.Android -c Debug -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true
          mkdir -p out; cp samples/RoyalTerminal.Multiplexing.Mobile.Android/bin/Debug/net10.0-android/*-Signed.apk out/workspace-debug.apk
      - name: Launch installed native client on Android emulator
        run: bash scripts/workspace/mobile-android.sh
      - uses: actions/upload-artifact@v7
        with: {name: workspace-android-debug, path: out/, if-no-files-found: error, retention-days: 7}
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - name: Build and launch on an iPhone simulator
        run: |
          dotnet workload install ios
          bash scripts/workspace/mobile-ios.sh
      - uses: actions/upload-artifact@v7
        with: {name: workspace-ios-simulator, path: out/, if-no-files-found: error, retention-days: 7}
