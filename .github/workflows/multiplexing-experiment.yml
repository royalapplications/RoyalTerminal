name: Multiplexing experiment

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'experiment/**']
    paths:
      - '.github/workflows/multiplexing-experiment.yml'
      - 'src/**'
      - 'samples/RoyalTerminal.Multiplexing.*/**'
      - 'tests/RoyalTerminal.Multiplexing.*/**'
      - 'scripts/build-unix-pty.sh'
      - 'native/unix-pty/**'
      - 'Directory.*'
      - 'global.json'
      - 'NuGet.Config'
      - 'RoyalTerminal.slnx'
  pull_request:
    paths:
      - '.github/workflows/multiplexing-experiment.yml'
      - 'src/**'
      - 'samples/RoyalTerminal.Multiplexing.*/**'
      - 'tests/RoyalTerminal.Multiplexing.*/**'
      - 'scripts/build-unix-pty.sh'
      - 'native/unix-pty/**'
      - 'Directory.*'
      - 'global.json'
      - 'NuGet.Config'
      - 'RoyalTerminal.slnx'

permissions:
  contents: read

concurrency:
  group: multiplexing-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  managed-tests:
    name: Experiment tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux headless font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libfreetype6 fonts-dejavu-core

      - name: Build macOS PTY launcher
        if: runner.os == 'macOS'
        run: bash scripts/build-unix-pty.sh

      - name: Test broker, inspection, automation, clients, and real process flows
        shell: bash
        run: |
          set -uo pipefail
          projects=(
            RoyalTerminal.Multiplexing.Tests
            RoyalTerminal.Multiplexing.InspectionTests
            RoyalTerminal.Multiplexing.AutomationTests
            RoyalTerminal.Multiplexing.ClientTests
            RoyalTerminal.Multiplexing.DesktopTests
            RoyalTerminal.Multiplexing.ServerTests
          )
          result=0
          for project in "${projects[@]}"; do
            dotnet test "tests/${project}/${project}.csproj" \
              -c Release -m:1 -nr:false -p:UseSharedCompilation=false \
              --logger "trx;LogFileName=${project}.trx" \
              --results-directory test-results \
              --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none || result=1
          done
          exit "${result}"

      - name: Upload managed test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiplexing-tests-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  browser-tests:
    name: Browser and PTY flows (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: samples/RoyalTerminal.Multiplexing.Server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: samples/RoyalTerminal.Multiplexing.Server/package-lock.json

      - name: Install pinned browser dependencies
        run: npm ci

      - name: Build local terminal assets
        run: npm run build

      - name: Test browser protocol and key handling
        run: npm test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build managed experiment host
        run: dotnet build RoyalTerminal.Multiplexing.Server.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false

      - name: Exercise browser attach, replay, layouts, and real PTY input
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=line,html

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiplexing-browser-results
          path: |
            samples/RoyalTerminal.Multiplexing.Server/playwright-report/
            samples/RoyalTerminal.Multiplexing.Server/test-results/
          if-no-files-found: warn
          retention-days: 7
