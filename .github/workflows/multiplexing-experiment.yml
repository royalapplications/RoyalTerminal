name: Multiplexing experiment
on:
  pull_request:
    paths:
      - '.github/workflows/multiplexing-experiment.yml'
      - '.github/workflows/workspace-*.yml'
      - 'src/RoyalTerminal.Multiplexing*/**'
      - 'src/RoyalTerminal.Terminal*/**'
      - 'src/RoyalTerminal.Avalonia/**'
      - 'samples/RoyalTerminal.Multiplexing.*/**'
      - 'tests/RoyalTerminal.Multiplexing.*/**'
      - 'tests/workspace-lua/**'
      - 'scripts/workspace/**'
      - 'native/unix-pty/**'
      - 'scripts/build-unix-pty.sh'
      - 'Directory.*'
      - 'global.json'
      - 'NuGet.Config'
  workflow_dispatch:
  push:
    tags: ['workspace-ci/matrix/*']
permissions: {contents: read}
concurrency:
  group: workspace-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  managed-tests:
    name: Workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1 libfreetype6 fonts-dejavu-core lua5.1 lua-dkjson
      - if: runner.os == 'macOS'
        run: bash scripts/build-unix-pty.sh
      - name: Browser model, key handling and protocol tests (no browser installation)
        if: runner.os == 'Linux'
        working-directory: samples/RoyalTerminal.Multiplexing.Server
        run: node --test browser-tests/*.test.mjs
      - name: Managed, native headless and phone interaction suites
        shell: bash
        run: |
          set -euo pipefail
          result=0
          for suite in Tests InspectionTests AutomationTests ClientTests DesktopTests ServerTests MobileTests; do
            project="RoyalTerminal.Multiplexing.$suite"
            dotnet test "tests/$project/$project.csproj" -c Release -m:1 -nr:false -p:UseSharedCompilation=false --logger "trx;LogFileName=$suite.trx" --results-directory test-results --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none || result=1
          done
          exit "$result"
      - name: Exercise both Lua hosts, real PTYs, receiver outcomes and scoped denial
        if: runner.os == 'Linux'
        run: python3 scripts/workspace/smoke-placement-focus.py
      - name: Optional visual review on this runner (tag the tip commit with [workspace-ui])
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        working-directory: samples/RoyalTerminal.Multiplexing.Server
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          WORKSPACE_REVIEW_EVIDENCE: ${{ github.workspace }}/test-results/workspace-review
        run: |
          set -euo pipefail
          if ! git log -1 --format=%s "$REVIEW_HEAD" | grep -Fq '[workspace-ui]'; then exit 0; fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:stream-only
          cp -R wwwroot/vendor bin/Release/net10.0/wwwroot/
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          npx --no-install playwright test workspace-review.spec.mjs action-palette.spec.mjs mobile-alerts.spec.mjs workspace.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'multiplexing-tests-${{ matrix.os }}', path: test-results/, retention-days: 7}
  browser-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {working-directory: samples/RoyalTerminal.Multiplexing.Server}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '26', cache: npm, cache-dependency-path: samples/RoyalTerminal.Multiplexing.Server/package-lock.json}
      - run: npm ci && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: dotnet build -c Release -m:1 -nr:false -p:UseSharedCompilation=false
      - run: npx playwright test --reporter=line,html
        env: {PLAYWRIGHT_HTML_OPEN: never}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multiplexing-browser-results
          path: |
            samples/RoyalTerminal.Multiplexing.Server/playwright-report/
            samples/RoyalTerminal.Multiplexing.Server/test-results/
          retention-days: 7
