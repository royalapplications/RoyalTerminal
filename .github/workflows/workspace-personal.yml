name: Personal workspace bundle
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/workspace-personal.yml'
      - 'scripts/workspace/**'
      - 'src/**'
      - 'samples/RoyalTerminal.Multiplexing.*/**'
      - 'Directory.*'
      - 'global.json'
permissions:
  contents: read
concurrency:
  group: personal-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Publish local-only bundle
        run: bash scripts/workspace/publish-personal.sh "$RUNNER_TEMP/royalterminal-personal"
      - name: Exercise install, real Unix socket I/O, safe upgrade and removal
        run: bash scripts/workspace/smoke-personal.sh "$RUNNER_TEMP/royalterminal-personal"
      - name: Archive verified unsigned build without credentials
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/royalterminal-personal.tar.gz" royalterminal-personal
      - uses: actions/upload-artifact@v7
        with:
          name: experimental-personal-linux
          path: ${{ runner.temp }}/royalterminal-personal.tar.gz
          retention-days: 7
