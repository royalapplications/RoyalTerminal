name: Typed workspace block protocol
on:
  pull_request:
    paths: ['samples/RoyalTerminal.Multiplexing.*/**','src/RoyalTerminal.Multiplexing*/**','src/RoyalTerminal.Terminal*/**','scripts/workspace/smoke-block-protocol.py','scripts/workspace/smoke-session-tools.py','scripts/workspace/smoke-lua-json.py','tests/workspace-lua/**','.github/workflows/workspace-block-protocol.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'workspace-block-protocol-${{ github.ref }}', cancel-in-progress: true}
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 lua-dkjson
      - run: dotnet build samples/RoyalTerminal.Multiplexing.Cli -c Release && dotnet build samples/RoyalTerminal.Multiplexing.Server -c Release
      - name: Exercise every registered terminal method against a real process and both Lua hosts
        run: python3 scripts/workspace/smoke-block-protocol.py
      - name: Check shared Lua JSON semantics in a real CLI script and a server configuration action
        run: python3 scripts/workspace/smoke-lua-json.py
      - name: Move and resize live terminal processes and exercise scoped session introspection
        run: python3 scripts/workspace/smoke-session-tools.py
